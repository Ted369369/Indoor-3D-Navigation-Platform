name: Deploy web app to GitHub Pages

# Publishes web/ to the gh-pages branch. GitHub Pages serves that branch at
# https://ted369369.github.io/Indoor-3D-Navigation-Platform/
# (If Pages is ever disabled: Settings > Pages > Source: Deploy from a branch,
#  Branch: gh-pages, folder: / root.)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
